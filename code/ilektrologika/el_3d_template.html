<title>Κατεβάσματα Β1 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&display=swap">
<style>
/* Διάταξη: το 3D πιάνει όλη την οθόνη· ένα πλαίσιο πάνω αριστερά με τίτλο, στρώσεις και όψεις. */
:root{--bg:#eef0f3;--panel:#ffffffee;--fg:#1c2330;--mute:#5d6878;--line:#cfd5de;--accent:#0b6bcb;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a21;--panel:#222834ee;--fg:#e8ecf2;--mute:#9aa6b6;--line:#3a4352;--accent:#6fb3ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a21;--panel:#222834ee;--fg:#e8ecf2;--mute:#9aa6b6;--line:#3a4352;--accent:#6fb3ff;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;position:relative}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#ui{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(290px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:calc(100% - 70px);overflow:auto}
h1{font-family:var(--f-head);font-size:16px;margin:0 0 2px;text-wrap:balance}
.sub{font-size:11.5px;color:var(--mute);margin:0 0 8px}
details summary{cursor:pointer;font-weight:600;font-size:12.5px;padding:4px 0}
.grp{display:flex;flex-direction:column;gap:3px;margin:4px 0 8px}
label{display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.25;cursor:pointer}
label .n{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums;font-size:11.5px}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.cap{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.views{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
button{font:600 12px var(--f-body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
#hint{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11.5px;color:var(--mute);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#err{position:absolute;inset:auto 16px 40px;color:var(--fg);font-size:13px}
</style>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Κατεβάσματα καλωδίων – Β1</h1>
  <p class="sub" id="sub"></p>
  <details open id="det"><summary>Τι βλέπω</summary>
    <div class="cap">Πώς μπαίνει το καλώδιο στον τοίχο</div>
    <div class="grp" id="modes"></div>
    <div class="cap">Κτίριο και οδεύσεις</div>
    <div class="grp" id="layers"></div>
    <div class="cap">Όψη</div>
    <div class="views"><button id="v1" type="button">Από πάνω</button><button id="v2" type="button">Από νοτιοδυτικά</button><button id="v3" type="button">Από βορειοανατολικά</button></div>
  </details>
</div>
<div id="hint">Σύρε για περιστροφή · δεξί κουμπί ή δύο δάχτυλα για μετακίνηση · ροδέλα για ζουμ</div>
<div id="err" hidden>Το 3D δεν φόρτωσε. Ξανάνοιξε τη σελίδα.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const D = /*DATA*/null;
(function(){
if(!window.THREE||!D){document.getElementById('err').hidden=false;return;}
const T=THREE, cv=document.getElementById('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const S=new T.Scene(), cam=new T.PerspectiveCamera(40,1,0.1,200);
S.add(new T.AmbientLight(0xffffff,.62)); const dl=new T.DirectionalLight(0xffffff,.38); dl.position.set(-6,14,9); S.add(dl);
const V=(x,y,z)=>new T.Vector3(x,z,y);                 // μοντέλο (x ανατολή, y νότος, z ύψος) → three (X, Y πάνω, Z)
const G={}; const grp=k=>G[k]||(S.add(G[k]=new T.Group()),G[k]);
function box(g,x0,y0,x1,y1,z0,z1,col,op){const m=new T.Mesh(new T.BoxGeometry(x1-x0,z1-z0,y1-y0),
  new T.MeshLambertMaterial({color:col,transparent:op<1,opacity:op,depthWrite:op>=1}));m.position.copy(V((x0+x1)/2,(y0+y1)/2,(z0+z1)/2));g.add(m);return m;}
function tube(g,a,b,r,mat){const A=V(...a),B=V(...b),L=A.distanceTo(B);if(L<1e-4)return;
  const m=new T.Mesh(new T.CylinderGeometry(r,r,L,8),mat);m.position.copy(A.clone().add(B).multiplyScalar(.5));
  m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),B.clone().sub(A).normalize());g.add(m);
  const j=new T.Mesh(new T.SphereGeometry(r,8,6),mat);j.position.copy(B);g.add(j);}
function label(g,txt,x,y,z,sc,fg,bgc){const c=document.createElement('canvas'),k=c.getContext('2d'),fs=44;k.font='600 '+fs+'px Inter,system-ui,sans-serif';
  const w=Math.ceil(k.measureText(txt).width)+28;c.width=w;c.height=fs+22;k.font='600 '+fs+'px Inter,system-ui,sans-serif';
  k.fillStyle=bgc;k.fillRect(0,0,w,c.height);k.fillStyle=fg;k.textBaseline='middle';k.fillText(txt,14,c.height/2+2);
  const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false}));s.scale.set(sc*w/c.height,sc,1);s.position.copy(V(x,y,z));s.renderOrder=5;g.add(s);}
// κτίριο
box(grp('floor'),-1.4,-0.2,14.2,10.6,-0.06,0,0xcfc9bb,1);
D.walls.forEach(w=>box(grp('walls'),w[0],w[1],w[2],w[3],0,w[4],w[5]?0xc98f6b:0x8d97a3,.34));
D.cols.forEach(c=>box(grp('walls'),c[0],c[1],c[2],c[3],0,2.98,0x555c66,.45));
D.beams.forEach(b=>{box(grp('beams'),b[1],b[2],b[3],b[4],b[5],2.98,0x6c7480,.38);});
D.rooms.forEach(r=>label(grp('names'),r[0],r[1],r[2],0.03,0.26,'#1c2330','rgba(255,255,255,.82)'));
const mh=new T.MeshLambertMaterial({color:0xa0199e});
D.holes.forEach(h=>{const a=h.ax==='y'?[h.x,h.y-.17,h.z]:[h.x-.17,h.y,h.z],b=h.ax==='y'?[h.x,h.y+.17,h.z]:[h.x+.17,h.y,h.z];tube(grp('holes'),a,b,.0375,mh);
  label(grp('holes'),h.id,h.x,h.y,3.12,0.2,'#ffffff','#a0199e');});
const RC={pwr:0xd0312d,weak:0x1f8a4c,hvac:0x7a3fc4,feed:0x111111};
D.routes.forEach(r=>{const m=new T.MeshLambertMaterial({color:RC[r.k]||0xd0312d});for(let i=1;i<r.pts.length;i++)tube(grp('routes'),r.pts[i-1],r.pts[i],r.k==='feed'?.03:.018,m);});
// κατεβάσματα
const MODES=[['top','Από το ταβάνι, ίσια',0x1f9d55],['side','Κάτω από το δοκάρι, από το πλάι',0x0d8fa8],['via','Οριζόντια μέσα στον τοίχο',0xe08a00],
  ['back','Μέσα από τη ντουλάπα του χωλ',0x8a4fd1],['furn','Μέσα από ντουλάπα δωματίου',0xb34fa0],['floor','Από το πάτωμα',0x8a5a14]];
const KC={sock:0xd0312d,sw:0x1c6fd1,data:0x1f8a4c,oth:0x555555};
const cnt={};
D.drops.forEach(d=>{cnt[d.m]=(cnt[d.m]||0)+1;const g=grp('m_'+d.m),col=MODES.find(q=>q[0]===d.m)[2],m=new T.MeshLambertMaterial({color:col});
  for(let i=1;i<d.pts.length;i++)tube(g,d.pts[i-1],d.pts[i],.013,m);
  const e=d.pts[d.pts.length-1],bx=new T.Mesh(new T.BoxGeometry(.09,.09,.09),new T.MeshLambertMaterial({color:KC[d.k]}));bx.position.copy(V(...e));g.add(bx);
  label(grp('ids'),d.id,e[0],e[1],e[2]+.14,0.11,'#1c2330','rgba(255,255,255,.85)');});
// πλαίσιο
document.getElementById('sub').textContent='Τυπικός όροφος · '+D.drops.length+' σημεία · ίδιο μοντέλο με το τεύχος '+D.rev;
function row(par,key,txt,col,on,n){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=on;i.id='t_'+key;
  i.addEventListener('change',()=>{grp(key).visible=i.checked;draw();});grp(key).visible=on;l.appendChild(i);
  if(col!=null){const s=document.createElement('span');s.className='sw';s.style.background='#'+col.toString(16).padStart(6,'0');l.appendChild(s);}
  l.appendChild(document.createTextNode(txt));if(n!=null){const c=document.createElement('span');c.className='n';c.textContent=n;l.appendChild(c);}par.appendChild(l);}
const pm=document.getElementById('modes'),pl=document.getElementById('layers');
MODES.forEach(m=>{if(cnt[m[0]])row(pm,'m_'+m[0],m[1],m[2],true,cnt[m[0]]);});
row(pl,'routes','Οδεύσεις στο ταβάνι',0xd0312d,true);row(pl,'holes','Οπές στα δοκάρια',0xa0199e,true);row(pl,'beams','Δοκάρια',0x6c7480,true);
row(pl,'walls','Τοίχοι και κολόνες',0x9aa3ad,true);row(pl,'names','Ονόματα χώρων',null,true);row(pl,'ids','Αριθμοί σημείων',null,false);
// κάμερα
const tg=V(6.3,5.2,1.2);let th=-0.8,ph=0.95,rad=22;
function place(){cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);}
function draw(){place();R.render(S,cam);}
function size(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  R.setClearColor(new T.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#eef0f3'));
  if(w<560)document.getElementById('det').open=false;draw();}
const P=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY,e.button]);});
cv.addEventListener('pointerup',e=>{P.delete(e.pointerId);pd=0;});cv.addEventListener('pointercancel',e=>{P.delete(e.pointerId);pd=0;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function pan(dx,dy){const k=rad*0.0012,r=new T.Vector3().setFromMatrixColumn(cam.matrix,0),u=new T.Vector3().setFromMatrixColumn(cam.matrix,1);tg.addScaledVector(r,-dx*k).addScaledVector(u,dy*k);}
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(P.size>=2){const a=[...P.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)rad=Math.max(3,Math.min(60,rad*pd/d));pd=d;pan(dx/2,dy/2);}
  else if(p[2]===2||e.shiftKey)pan(dx,dy);else{th-=dx*.006;ph=Math.max(.05,Math.min(1.5,ph-dy*.006));}draw();});
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.max(3,Math.min(60,rad*(e.deltaY>0?1.1:.9)));draw();},{passive:false});
function view(a,b,r){th=a;ph=b;rad=r;tg.copy(V(6.3,5.2,1.2));draw();}
document.getElementById('v1').addEventListener('click',()=>view(0,.05,24));
document.getElementById('v2').addEventListener('click',()=>view(-0.8,.95,22));
document.getElementById('v3').addEventListener('click',()=>view(2.3,.95,22));
addEventListener('resize',size);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',size);
new MutationObserver(size).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
size();
})();
</script>
